menu_bar = false
prompt_save_view_preferences = false
theme = "custom"
transparent_background = true
watch = true

[keybindings]
"hunk.review.scrollCodeLeft" = ["h", "shift+h", "left", "shift+left"]
"hunk.review.scrollCodeRight" = ["l", "shift+l", "right", "shift+right"]
"hunk.view.toggleLineNumbers" = "i"

[custom_theme]
base = "github-dark-default"
label = "Neverforest"
background = "#1a1e22"
panel = "#1a1e22"
panelAlt = "#1a1e22"
border = "#515a5b"
accent = "#aeccc6"
accentMuted = "#2d343b"
text = "#d3c6aa"
muted = "#515a5b"
addedBg = "#202724"
removedBg = "#291e1e"
movedAddedBg = "#27251e"
movedRemovedBg = "#27251e"
contextBg = "#1a1e22"
addedContentBg = "#354033"
removedContentBg = "#44302f"
contextContentBg = "#1a1e22"
addedSignColor = "#a2ccae"
removedSignColor = "#e67e80"
lineNumberBg = "#1a1e22"
lineNumberFg = "#515a5b"
selectedHunk = "#42555c"
badgeAdded = "#a2ccae"
badgeRemoved = "#e67e80"
badgeNeutral = "#9da9a0"
fileNew = "#a2ccae"
fileDeleted = "#e67e80"
fileRenamed = "#dbbc7f"
fileModified = "#dbbc7f"
fileUntracked = "#a2ccae"
noteBorder = "#87b5c1"
noteBackground = "#20252a"
noteTitleBackground = "#272d33"
noteTitleText = "#d3c6aa"

[custom_theme.syntax_scopes]
source = "#d3c6aa"
keyword = "#77817d"
string = "#bec8b5"
comment = "#515a5b"
"punctuation.definition.comment" = "#515a5b"
"constant.numeric" = "#bec8b5"
"entity.name.function" = "#a2ccae"
"support.function" = "#a2ccae"
"variable.function" = "#a2ccae"
"variable.other.property" = "#bec8b5"
"support.variable.property" = "#bec8b5"
"entity.name.type" = "#aeccc6"
"entity.name.class" = "#aeccc6"
"support.type" = "#aeccc6"
"support.class" = "#aeccc6"
variable = "#f6f3ed"
"keyword.operator" = "#9da9a0"
punctuation = "#9da9a0"
