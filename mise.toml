[settings]
experimental = true
# This repo is expected to be cloned to ~/.dotfiles
# so implied dotfile sources resolve under ~/.dotfiles/dots.
dotfiles.root = "~/.dotfiles/dots"
dotfiles.default_mode = "symlink"

[bootstrap.packages]
"brew:agent-browser" = "latest"
"brew:bash" = "latest"
"brew:bat" = "latest"
"brew:bruno-cli" = "latest"
"brew:btop" = "latest"
"brew:colima" = "latest"
"brew:diffnav" = "latest"
"brew:docker" = "latest"
"brew:docker-buildx" = "latest"
"brew:docker-compose" = "latest"
"brew:fd" = "latest"
"brew:ffmpeg" = "latest"
"brew:fzf" = "latest"
"brew:gh" = "latest"
"brew:git" = "latest"
"brew:git-delta" = "latest"
"brew:go" = "latest"
"brew:herdr" = "latest"
"brew:hunk" = "latest"
"brew:just" = "latest"
"brew:kubectx" = "latest"
"brew:lazygit" = "latest"
"brew:lf" = "latest"
"brew:lsd" = "latest"
"brew:nono" = "latest"
"brew:pnpm" = "latest"
"brew:prettierd" = "latest"
"brew:ripgrep" = "latest"
"brew:shfmt" = "latest"
"brew:starship" = "latest"
"brew:television" = "latest"
"brew:tldr" = "latest"
"brew:tree" = "latest"
"brew:tree-sitter-cli" = "latest"
"brew:yarn" = "latest"
"brew:zoxide" = "latest"

[dotfiles]
"~/.agents" = {}
"~/.bash_aliases" = {}
"~/.bash_colors" = {}
"~/.bash_profile" = {}
"~/.bashrc" = {}
# Share skills from ~/.agents with Claude Code. The plannotator-* skills
# are omitted because the plannotator installer writes them to both places.
"~/.claude/skills/agent-browser" = { source = "dots/.agents/skills/agent-browser" }
"~/.claude/skills/bro" = { source = "dots/.agents/skills/bro" }
"~/.claude/skills/codebase-design" = { source = "dots/.agents/skills/codebase-design" }
"~/.claude/skills/grill-me" = { source = "dots/.agents/skills/grill-me" }
"~/.claude/skills/herdr" = { source = "dots/.agents/skills/herdr" }
"~/.claude/skills/improve-codebase-architecture" = { source = "dots/.agents/skills/improve-codebase-architecture" }
"~/.claude/skills/librarian" = { source = "dots/.agents/skills/librarian" }
"~/.claude/skills/make-a-prd" = { source = "dots/.agents/skills/make-a-prd" }
"~/.claude/skills/obsidian-notes" = { source = "dots/.agents/skills/obsidian-notes" }
"~/.claude/skills/show-me" = { source = "dots/.agents/skills/show-me" }
"~/.claude/skills/simplify" = { source = "dots/.agents/skills/simplify" }
"~/.claude/skills/tdd" = { source = "dots/.agents/skills/tdd" }
"~/.claude/skills/write-like-ryan" = { source = "dots/.agents/skills/write-like-ryan" }
"~/.claude/themes" = {}
"~/.config/bat" = {}
"~/.config/btop/themes" = {}
"~/.config/codebook" = {}
"~/.config/ghostty" = {}
"~/.config/herdr" = {}
"~/.config/hunk/config.toml" = {}
"~/.config/hunk/extensions" = {}
"~/.config/karabiner" = {}
"~/.config/lazygit" = {}
"~/.config/lf" = {}
"~/.config/nono/profiles" = {}
"~/.config/nvim" = {}
"~/.config/opencode" = {}
"~/.config/phpactor" = {}
"~/.config/starship.toml" = {}
"~/.config/television" = {}
"~/.config/zed" = {}
"~/.gitconfig" = {}
"~/.gitignore.global" = {}
"~/.local/bin/ralph" = {}
"~/.pi" = {}
"~/.plannotator/config.json" = {}

[tasks.bootstrap]
run = '''
mkdir -p ~/.claude/skills ~/.config ~/.local/bin
if [ ! -f ~/.git-completion.bash ]; then
  curl https://raw.githubusercontent.com/git/git/master/contrib/completion/git-completion.bash -o ~/.git-completion.bash
fi
'''
